name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/igormages/trek

jobs:
  build-and-deploy:
    if: github.repository == 'igormages/TREK'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          if [[ "$DEPLOY_HOST" == *:* ]]; then
            SSH_TARGET="[${DEPLOY_HOST}]"
          else
            SSH_TARGET="${DEPLOY_HOST}"
          fi
          ssh-keyscan -T 15 -H "${SSH_TARGET}" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<EOF
          Host trek-prod
            HostName ${SSH_TARGET}
            User root
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF

      - name: Deploy on production server
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TOKEN="${GHCR_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "::warning::GHCR_READ_TOKEN absent — GITHUB_TOKEN utilisé (échouera si le package GHCR est privé côté serveur)"
          fi
          echo "$TOKEN" | ssh trek-prod docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ssh trek-prod bash -s "${IMAGE_TAG}" <<'REMOTE'
          set -euo pipefail
          IMAGE_TAG="$1"
          cd /opt/trek
          sed -i "s|image:.*|image: ghcr.io/igormages/trek:${IMAGE_TAG}|" docker-compose.yml
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          echo "Running: $(docker inspect trek --format '{{.Config.Image}}')"
          REMOTE

      - name: Health check
        run: |
          ssh trek-prod bash -c '
            for i in $(seq 1 30); do
              if wget -qO- http://localhost:3000/api/health >/dev/null 2>&1; then
                echo "Health check OK"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed"
            docker logs trek --tail 50
            exit 1
          '
