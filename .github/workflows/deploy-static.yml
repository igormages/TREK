name: Deploy Static Frontend

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-static
  cancel-in-progress: true

env:
  STATIC_DIR: /var/lib/trek/static

jobs:
  deploy-static:
    if: github.repository == 'igormages/TREK'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore node_modules
        uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --workspace=shared --workspace=client

      - name: Restore shared build
        uses: actions/cache@v4
        id: shared-build
        with:
          path: shared/dist
          key: shared-dist-${{ hashFiles('shared/src/**', 'shared/tsdown.config.ts', 'shared/package.json', 'shared/tsconfig.json') }}

      - name: Build shared
        if: steps.shared-build.outputs.cache-hit != 'true'
        run: npm run build --workspace=shared

      - name: Restore Vite cache
        uses: actions/cache@v4
        id: vite-cache
        with:
          path: client/node_modules/.vite
          key: vite-${{ hashFiles('package-lock.json', 'client/vite.config.js') }}-${{ hashFiles('client/src/**') }}
          restore-keys: |
            vite-${{ hashFiles('package-lock.json', 'client/vite.config.js') }}-

      - name: Build client
        run: npm run build --workspace=client

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          if [[ "$DEPLOY_HOST" == *:* ]]; then
            SSH_TARGET="[${DEPLOY_HOST}]"
          else
            SSH_TARGET="${DEPLOY_HOST}"
          fi
          ssh-keyscan -T 15 -H "${SSH_TARGET}" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<EOF
          Host trek-prod
            HostName ${SSH_TARGET}
            User root
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF

      - name: Rsync static files to production
        run: |
          ssh trek-prod "mkdir -p ${STATIC_DIR}"
          rsync -avz --delete --compress-level=1 \
            --exclude '.DS_Store' \
            client/dist/ \
            trek-prod:${STATIC_DIR}/

      - name: Verify static files on server
        run: |
          ssh trek-prod bash -c "
            test -f ${STATIC_DIR}/index.html || { echo 'index.html manquant'; exit 1; }
            echo \"Fichiers statiques déployés: \$(find ${STATIC_DIR} -type f | wc -l) fichiers\"
          "
