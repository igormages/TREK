<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vérification Travelpayouts</title>
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Page de vérification de propriété du site pour Travelpayouts.

      Elle n'existe que pour que Travelpayouts retrouve son script dans le HTML
      servi par ce domaine et valide le compte. Elle est volontairement isolée :
      le script ci-dessous est du JavaScript tiers, et l'application elle-même
      est servie avec une CSP `script-src 'self'` (voir
      server/src/middleware/globalMiddleware.ts) qui interdit tout script
      distant. Rien de tiers ne doit donc entrer dans l'app.

      À savoir : ce script sert à la vérification et au suivi d'affiliation, PAS
      à l'authentification de l'API. Les appels à l'API Hotellook/Travelpayouts
      se font côté serveur avec un couple marker + token, configuré dans les
      réglages d'administration.

      Une fois le compte validé, ce fichier peut être supprimé.

      URL : https://trek.mages.pro/travelpayouts-verify.html
    -->
    <script
      nowprocket
      data-noptimize="1"
      data-cfasync="false"
      data-wpfc-render="false"
      seraph-accel-crit="1"
      data-no-defer="1"
      data-cmp-ab="2"
    >
      (function () {
        var script = document.createElement('script');
        script.async = 1;
        script.setAttribute('data-cmp-ab', '2');
        script.src = 'https://emrldtp.cc/NTYwMjgz.js?t=560283';
        document.head.appendChild(script);
      })();
    </script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #f7f7f8;
        color: #111827;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
        line-height: 1.6;
      }
      code {
        background: #e9eaee;
        padding: 0.15em 0.4em;
        border-radius: 0.3em;
        font-size: 0.9em;
      }
      p {
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vérification Travelpayouts</h1>
      <p>
        Cette page sert uniquement à valider la propriété du domaine auprès de
        Travelpayouts. Elle peut être supprimée une fois le compte vérifié.
      </p>
      <p>Marker : <code>560283</code></p>
    </main>
  </body>
</html>
